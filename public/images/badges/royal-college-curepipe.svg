<svg xmlns="http://www.w3.org/2000/svg" width="240" height="248" viewBox="0 0 240 248" fill="none" role="img" aria-labelledby="rcc-title rcc-description">
  <title id="rcc-title">Royal College Curepipe</title>
  <desc id="rcc-description">Modern vector redraw preserving the original centenary crest layout: crown inside a rounded shield, R.C.C., Terrae on the left ribbon, Apertae on the right, Quis Fructus below, and the 1914–2014 banner.</desc>
  <!-- Layout follows the owner-supplied rcclogo.jpg; the original JPG is retained. -->
  <defs>
    <path id="rcc-left-motto" d="M39 100Q37 130 58 151"/>
    <path id="rcc-right-motto" d="M182 151Q203 130 201 100"/>
    <path id="rcc-bottom-motto" d="M69 170Q120 181 171 170"/>
  </defs>

  <!-- Broad, gently waisted shield rather than a pointed replacement. -->
  <path d="M63 17Q120 6 177 17C168 49 168 80 173 111Q178 135 162 142Q120 158 78 142Q62 135 67 111C72 80 72 49 63 17Z" fill="#f4ede0" stroke="#9b6268" stroke-width="3.5"/>
  <path d="M70 22Q120 13 170 22C163 51 162 81 167 112Q171 130 159 135Q120 150 81 135Q69 130 73 112C78 81 77 51 70 22Z" fill="#353746"/>

  <!-- Crown retains the central diamond, rising points and curved lower band. -->
  <g fill="#d8ba70">
    <path d="M120 31L127 42L120 53L113 42Z"/>
    <path d="M86 48L100 64L104 48L112 67L120 57L128 67L136 48L140 64L154 48L145 82Q120 74 95 82Z"/>
    <path d="M96 88Q120 80 144 88L141 96Q120 89 99 96Z"/>
    <path d="M99 101Q120 94 141 101L138 108Q120 113 102 108Z"/>
  </g>
  <path d="M107 100L116 104L124 98L133 102" stroke="#353746" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="133" fill="#e5ca8c" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="2" text-anchor="middle">R.C.C.</text>

  <!-- Three distinct motto ribbons follow the supplied emblem's arrangement. -->
  <g fill="#353746">
    <path d="M28 87L43 92L54 88Q48 125 70 150L58 159Q28 143 28 87Z"/>
    <path d="M212 87L197 92L186 88Q192 125 170 150L182 159Q212 143 212 87Z"/>
    <path d="M58 157Q120 175 182 157L192 173L183 184Q120 197 57 184L48 173Z"/>
  </g>
  <g fill="#f3e3b8" font-family="Georgia,serif" font-size="9.5" font-weight="700" letter-spacing=".55" text-anchor="middle">
    <text><textPath href="#rcc-left-motto" startOffset="50%">TERRAE</textPath></text>
    <text><textPath href="#rcc-right-motto" startOffset="50%">APERTAE</textPath></text>
    <text font-size="11"><textPath href="#rcc-bottom-motto" startOffset="50%">QUIS FRUCTUS</textPath></text>
  </g>

  <path d="M64 223H176L171 232L176 241H64L69 232Z" fill="#353746"/>
  <text x="120" y="236" fill="#ead39b" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle">1914 – 2014</text>
</svg>
